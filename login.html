{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <!-- Login Form -->
    <div class="col-md-5 me-md-3 mb-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">User Login</h5>
            </div>
            <div class="card-body">
                <form action="/login" method="POST">
                    <input type="hidden" name="action" value="login">
                    
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">Login</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Registration Form -->
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Register New Profile</h5>
            </div>
            <div class="card-body">
                <form action="/login" method="POST">
                    <input type="hidden" name="action" value="register">
                    
                    <div class="mb-2">
                        <label class="form-label">Account Type</label>
                        <select name="role" class="form-select" required>
                            <option value="farmer">Farmer</option>
                            <option value="restaurant">Restaurant / Hotel Chef</option>
                        </select>
                    </div>
                    
                    <div class="mb-2">
                        <label class="form-label">Full Name / Business Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. Ramesh Patel or Green Bistro" required>
                    </div>
                    
                    <div class="mb-2">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-dark w-100">Register Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
